<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCF OS</title>
<meta name="theme-color" content="#0a0d14">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="style.css?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap">
</head>
<body>

  <!-- =========== WALLPAPER / BACKGROUND LAYER =========== -->
  <div id="wallpaper">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <!-- =========== TOP BAR =========== -->
  <header id="topbar">
    <div class="tb-left">
      <span class="logo-mcf"><svg class="mcf-mark" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="mcfg-tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc65c"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#mcfg-tb)"/><path d="M24 9.5 37 35.5 24 29.2 11 35.5Z" fill="#fff"/><path d="M24 9.5v19.7L11 35.5Z" fill="#fff" opacity=".72"/></svg></span>
      <span class="tb-title">MCF<span>OS</span></span>
    </div>
    <div class="tb-center">
      <span id="active-app">Escritorio</span>
    </div>
    <div class="tb-right">
      <span class="indicator" title="Online"></span>
      <span id="battery">87%</span>
      <span id="clock">—</span>
      <span id="zulu" title="Hora Zulu (UTC)">—</span>
    </div>
  </header>

  <!-- =========== DESKTOP =========== -->
  <main id="desktop">
    <!-- Desktop icons -->
    <div id="desktop-icons">
      <button class="d-icon" data-launch="finder">
        <span class="d-glyph" style="background:linear-gradient(135deg,#7cc5ff,#4a90e2)">📁</span>
        <span>Archivos</span>
      </button>
      <button class="d-icon" data-launch="browser">
        <span class="d-glyph" style="background:linear-gradient(135deg,#c9a8ff,#8e6bff)">🌐</span>
        <span>Navegador</span>
      </button>
      <button class="d-icon" data-launch="notes">
        <span class="d-glyph" style="background:linear-gradient(135deg,#ffd36b,#ffa06b)">📝</span>
        <span>Notas</span>
      </button>
      <button class="d-icon" data-launch="terminal">
        <span class="d-glyph" style="background:linear-gradient(135deg,#1a1f2a,#000)">⌨</span>
        <span>Terminal</span>
      </button>
      <button class="d-icon" data-launch="chat">
        <span class="d-glyph" style="background:linear-gradient(135deg,#ff7bff,#8e6bff)">✧</span>
        <span>Claude</span>
      </button>
      <button class="d-icon" data-launch="settings">
        <span class="d-glyph" style="background:linear-gradient(135deg,#9aa3b4,#4a5568)">⚙</span>
        <span>Ajustes</span>
      </button>
    </div>

    <!-- Windows get injected here -->
    <div id="windows-layer"></div>
  </main>

  <!-- =========== DOCK =========== -->
  <nav id="dock">
    <div class="dock-inner">
      <button class="dock-item" data-launch="finder" title="Archivos">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#7cc5ff,#4a90e2)">📁</span>
      </button>
      <button class="dock-item" data-launch="browser" title="Navegador">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#c9a8ff,#8e6bff)">🌐</span>
      </button>
      <button class="dock-item" data-launch="notes" title="Notas">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#ffd36b,#ffa06b)">📝</span>
      </button>
      <button class="dock-item" data-launch="terminal" title="Terminal">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#1a1f2a,#000)">⌨</span>
      </button>
      <button class="dock-item" data-launch="chat" title="Claude">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#ff7bff,#8e6bff)">✧</span>
      </button>
      <div class="dock-sep"></div>
      <button class="dock-item" data-launch="settings" title="Ajustes">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#9aa3b4,#4a5568)">⚙</span>
      </button>
      <button class="dock-item" data-launch="about" title="Acerca de">
        <span class="dock-glyph" style="background:linear-gradient(135deg,#58e38a,#2a9d5a)">ℹ</span>
      </button>
    </div>
  </nav>

  <!-- =========== BOOT SPLASH =========== -->
  <div id="boot">
    <div class="boot-logo"><svg class="mcf-mark" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="mcfg-boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc65c"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#mcfg-boot)"/><path d="M24 9.5 37 35.5 24 29.2 11 35.5Z" fill="#fff"/><path d="M24 9.5v19.7L11 35.5Z" fill="#fff" opacity=".72"/></svg></div>
    <div class="boot-text">MCF<span>OS</span></div>
    <ul class="boot-check">
      <li><span>BATTERY</span><i></i><b>ON</b></li>
      <li><span>AVIONICS</span><i></i><b>ON</b></li>
      <li><span>NEBULA</span><i></i><b>READY</b></li>
      <li><span>MCF OS</span><i></i><b>CLEARED</b></li>
    </ul>
    <div class="boot-bar"><span></span></div>
  </div>

  <script>
    /* Si hay una versión nueva publicada, recarga sola saltándose la caché */
    window.MCF_VERSION = "6";
    fetch("version.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(v => {
        if (!v || v.v === window.MCF_VERSION) return;
        let tried = null;
        try { tried = sessionStorage.getItem("mcf-upd"); sessionStorage.setItem("mcf-upd", v.v); } catch {}
        if (tried !== v.v) location.replace(location.pathname + "?v=" + encodeURIComponent(v.v));
      })
      .catch(() => {});
  </script>
  <script src="os.js?v=6"></script>
  <script src="apps/icons.js?v=6"></script>
  <script src="apps/browser.js?v=6"></script>
</body>
</html>
